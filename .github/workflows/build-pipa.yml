name: Build pipa UEFI
on:
  push:
    branches: ["main"]
    paths:
      - 'Binaries/pipa/**'
      - 'Platforms/Xiaomi/pipaPkg/**'
      - 'Silicon/Qualcomm/QcomPkg/**'
      - 'Silicon/Silicium/**'
      - 'Mu_Basecore/**'
      - 'Common/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '分支或标签 (例如 main, v2.7, pipaport)'
        required: true
        default: 'pipaport'

jobs:
  build-pipa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          submodules: false
          fetch-depth: 0

      - name: Initialize Mu_Basecore
        run: |
          git submodule sync
          git submodule update --init --force Mu_Basecore
          cd Mu_Basecore
          git checkout f44f77a3fee3a0e56f98ae864701b74b3dcf3eb1
          cd ..

      - name: Setup environment
        run: bash ./setup_env.sh -p apt

      - name: Disable OverrideValidation plugin
        run: |
          if [ -d "Mu_Basecore/BaseTools/Plugin/OverrideValidation" ]; then
            mv Mu_Basecore/BaseTools/Plugin/OverrideValidation Mu_Basecore/BaseTools/Plugin/OverrideValidation.disabled
            echo "OverrideValidation plugin disabled"
          else
            echo "OverrideValidation plugin not found, skipping"
          fi

      - name: Build pipa UEFI
        run: bash ./build_uefi.sh -d pipa -r DEBUG

      - name: Upload pipa UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: pipa-uefi
          path: ./Mu-pipa*
          compression-level: 9
