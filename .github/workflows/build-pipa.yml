name: Build pipa UEFI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支或标签 (例如 main, v2.7, pipaport)'
        required: true
        default: 'pipaport'

jobs:
  build-pipa:
    runs-on: ubuntu-22.04   # 使用 22.04 避免 nuget/python3-distutils 缺失问题
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install dependencies manually
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip git build-essential uuid-dev iasl nasm gcc-aarch64-linux-gnu

      - name: Setup Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r pip-requirements.txt

      - name: Build pipa UEFI
        run: |
          source venv/bin/activate
          # 根据分支选择构建脚本
          if [ -f "build_uefi.py" ]; then
            python3 build_uefi.py -d pipa -r DEBUG -c
          else
            bash build_uefi.sh -d pipa -r DEBUG -c
          fi

      - name: Upload pipa UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: pipa-uefi
          path: ./Mu-pipa*
          compression-level: 9
